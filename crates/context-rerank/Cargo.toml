[package]
name = "pgcontext-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "pgcontext_worker"

[[bin]]
name = "pgcontext-worker"
path = "src/main.rs"

[features]
worker-test-hooks = []

[dependencies]
context-core = { path = "../context-core", version = "0.1.0" }
context-query = { path = "../context-query", version = "0.1.0" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-util", "io-std", "sync", "time"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
